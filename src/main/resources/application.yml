server:
  port: 8083 # Porta 8083 para este 4o projeto!

spring:
  application:
    name: nosql-messaging-lab

  # ============================================================================
  # 1. BANCO RELACIONAL H2 (Modo PostgreSQL) - Persistência Transacional
  # ============================================================================
  datasource:
    url: jdbc:h2:mem:polyglot_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

  # ============================================================================
  # 2. REDIS (Cache-Aside & Concorrência Distribuída)
  # ============================================================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # ============================================================================
  # 3. MONGODB (Document Store NoSQL)
  # ============================================================================
  data.mongodb:
    uri: mongodb://localhost:27017/nosql_lab_db

  # ============================================================================
  # 4. APACHE KAFKA (Event Streaming & Log de Eventos)
  # ============================================================================
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: nosql-lab-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ============================================================================
  # 5. RABBITMQ (AMQP Message Broker)
  # ============================================================================
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual # Manual ACK para controle total da mensageria!

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

